# Primary configuration for the default SQL-backed backend runtime.
# This file is used when no profile-specific override takes precedence and
# assumes a locally reachable MySQL database plus the full JPA/Flyway stack.

# Application identity and authentication defaults shared across the backend.
# The JWT secret is acceptable for local development only and should be
# replaced with an environment-specific secret in any real deployment.
spring.application.name=backend
app.jwt.secret=THIS_IS_A_DEMO_SECRET_KEY_1234567890_ABCDE
app.jwt.expirationMinutes=60

# Selects the default persistence mode.
# The SQL store is the normal backend path and activates database-backed
# implementations unless a profile overrides it.
app.store=sql


spring.datasource.url=jdbc:mysql://localhost:3306/yupathbuilder?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=yupath
spring.datasource.password=yupathpass

# SQL logging is enabled here to make repository behavior easier to inspect
# during local development and integration debugging.
spring.jpa.show-sql=true

# Hibernate is intentionally prevented from managing schema state here because
# Flyway owns schema creation and evolution for the SQL-backed application.
# IMPORTANT: Flyway must run before Hibernate validates
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true

# Flyway startup behavior for the default SQL environment.
# These settings favor local development resilience by allowing baseline and
# repair flows when schema history needs recovery.
# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
app.flyway.repair-on-startup=true

# Flyway logging is elevated because migration problems are a common source of
# backend startup failures during local setup.
# Logging (ojo: FLYWAYDB, no "flyawdb")
logging.level.org.flywaydb=DEBUG
