spring.application.name=backend
app.jwt.secret=THIS_IS_A_DEMO_SECRET_KEY_1234567890_ABCDE
app.jwt.expirationMinutes=60

app.store=sql


spring.datasource.url=jdbc:mysql://localhost:3307/yupathbuilder?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=yupath
spring.datasource.password=yupathpass
spring.jpa.show-sql=true

# IMPORTANT: Flyway must run before Hibernate validates
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
app.flyway.repair-on-startup=true

# Logging (ojo: FLYWAYDB, no "flyawdb")
logging.level.org.flywaydb=DEBUG
