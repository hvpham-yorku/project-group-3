# Stub-profile overrides for running the backend without a live database.
# This file is intended for local development, demos, and frontend integration
# where JSON-backed stub data should replace SQL-backed infrastructure.

# Switch the application onto the stub-backed store implementations.
# run without MySQL
app.store=stub

# Disable database-dependent startup work in stub mode so the backend can start
# without opening JDBC connections or validating SQL schema state.
# prevent Flyway and Hibernate schema validation from touching the DB
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none

# Keep persistence-related logs quieter when the application is intentionally
# running without SQL integration.
# optional (keeps logs cleaner)
spring.jpa.show-sql=false
# The remaining overrides control how aggressively Spring disables JDBC, JPA,
# and Flyway auto-configuration while stub mode is active.
